<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Netflix Clone</title>
    <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
    <style>
      :root{
        --bg:#000;
        --logo-grey:#8a8a8a;
        --muted:#bfbfbf;
      }
      html,body{height:100%;}
      body{
        margin:0;
        background:var(--bg);
        color:#fff;
        font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      }
      .app-header{
        display:flex;
        align-items:flex-end;
        gap:12px;
        padding:28px 36px;
      }
      .logo{
        font-family: 'Anton', "Helvetica Neue", Arial, sans-serif;
        font-size:72px;
        line-height:1;
        color:var(--logo-grey);
        letter-spacing:-2px;
        text-transform:uppercase;
      }
      .clone-badge{
        font-size:12px;
        color:var(--muted);
        background:rgba(255,255,255,0.03);
        padding:6px 8px;
        border-radius:6px;
        font-weight:700;
        align-self:flex-start;
        margin-top:8px;
        text-transform:lowercase;
      }
      .hero{display:flex;align-items:center;justify-content:center;height:calc(100vh - 120px);}
      .hero h1{color:#ddd;font-weight:400}
    </style>
  </head>

  <body>
    <header class="app-header">
      <div class="logo">NETFLIX<span class="clone-badge">clone</span></div>
    </header>

    <main class="hero">
      <div>
        <h1>Welcome to the Netflix clone</h1>
      </div>
    </main>

    <div id="root"></div>
  </body>
</html>
